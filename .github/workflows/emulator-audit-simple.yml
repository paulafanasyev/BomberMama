name: BomberMama Emulator Audit Simple

on:
  push:
    branches:
      - audit/emulator-2026-09-20

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash audit/run_emulator_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bombermama-emulator-audit
          path: |
            audit/
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
