name: BomberMama Emulator Audit

on:
  push:
    branches:
      - audit/emulator-2026-09-20
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java
        run: java -version

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.13/bin/gradle --version

      - name: Run JVM and Robolectric tests
        run: gradle test --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Download and verify exact v1.0 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          curl -fL --retry 3 -o audit/release.apk \
            https://github.com/paulafanasyev/BomberMama/releases/download/v1.0/BomberMama.apk
          echo "f6f099ab09954e9e550a13712d0b42ca2242857e0847c373ae8ae9e2fcc41  audit/release.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging audit/release.apk | tee audit/aapt-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose audit/release.apk | tee audit/apksigner.txt
          sha256sum audit/release.apk | tee audit/sha256.txt
          ls -lh audit/release.apk app/build/outputs/apk/debug/app-debug.apk | tee audit/apk-files.txt

      - name: Install Android emulator components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "system-images;android-35;google_apis;x86_64"

      - name: Run exact release APK on emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/screens

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          echo "no" | avdmanager create avd \
            -n bombermama-audit \
            -k "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          emulator @bombermama-audit \
            -no-window \
            -no-audio \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-boot-anim \
            >/tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb wait-for-device
          for i in $(seq 1 120); do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOTED" = "1" ]; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat /tmp/emulator.log || true
              exit 1
            fi
            sleep 2
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb uninstall com.bombermama >/dev/null 2>&1 || true
          adb install audit/release.apk
          adb shell pm clear com.bombermama >/dev/null
          adb logcat -c

          adb shell monkey -p com.bombermama 1 >/dev/null
          sleep 3
          adb shell pidof com.bombermama
          adb shell dumpsys package com.bombermama | grep -E "versionCode|versionName|targetSdk"

          screenshot() {
            local name="$1"
            adb exec-out screencap -p > "audit/screens/$name.png"
          }

          click_id() {
            local rid="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | tr -d '\n' > audit/window.xml
            local xy
            xy=$(python3 - "$rid" <<'PY'
import re, sys
rid = sys.argv[1]
xml = open("audit/window.xml", "r", encoding="utf-8").read()
m = re.search(r'<node[^>]*resource-id="' + re.escape(rid) + r'"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
if not m:
    raise SystemExit(f"resource-id not found: {rid}")
x1,y1,x2,y2 = map(int, m.groups())
print((x1+x2)//2, (y1+y2)//2)
PY
)
            adb shell input tap $xy
            sleep 1
          }

          screenshot "01_main"

          click_id "com.bombermama:id/btnLevels"
          screenshot "02_levels"

          adb shell input keyevent 4
          sleep 1

          click_id "com.bombermama:id/btnSettings"
          screenshot "03_settings"
          click_id "com.bombermama:id/swSound"
          sleep 0.5
          click_id "com.bombermama:id/swMusic"
          sleep 0.5
          screenshot "04_settings_toggles"
          adb shell input keyevent 4
          sleep 1

          click_id "com.bombermama:id/btnNewGame"
          sleep 3
          screenshot "05_game_initial"

          # D-pad swipe: GameSurfaceView is landscape and places the control
          # around the lower-left quadrant. Bomb button is lower-right.
          adb shell input swipe 160 900 340 900 500
          sleep 0.5
          adb shell input tap 1700 900
          sleep 0.4
          screenshot "06_bomb_active"
          sleep 1.4
          screenshot "07_post_bomb"

          click_id "com.bombermama:id/btnPause"
          screenshot "08_pause"
          click_id "com.bombermama:id/btnResume"
          sleep 0.8
          screenshot "09_resume"

          adb shell input keyevent 4
          sleep 0.8
          screenshot "10_pause_back"

          # Relaunch validates that persisted settings survive process restart.
          adb shell am force-stop com.bombermama
          adb shell monkey -p com.bombermama 1 >/dev/null
          sleep 2
          screenshot "11_relaunch"

          adb shell uiautomator dump /sdcard/final.xml >/dev/null || true
          adb shell cat /sdcard/final.xml > audit/final-ui.xml || true
          adb logcat -d -v threadtime > audit/logcat.txt
          adb shell dumpsys package com.bombermama > audit/dumpsys-package.txt
          adb shell dumpsys meminfo com.bombermama > audit/meminfo.txt
          cat /tmp/emulator.log > audit/emulator.log || true

          # Runtime smoke assertions.
          test -n "$(adb shell pidof com.bombermama)"
          if grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process com.bombermama.*has died" audit/logcat.txt; then
            exit 1
          fi

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: bombermama-emulator-audit
          path: |
            audit/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
